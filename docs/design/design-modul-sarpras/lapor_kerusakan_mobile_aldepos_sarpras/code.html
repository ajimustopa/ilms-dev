  </head><body class="bg-surface font-body-medium text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Tutup dialog" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/40 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><h1 class="font-title-medium text-title-medium text-on-surface truncate">Lapor Kerusakan</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin-mobile pt-14 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-24">
<div class="flex flex-col gap-space-lg pt-space-sm">

<div aria-label="Pilih tipe objek laporan" class="w-full" role="group">
<div class="flex w-full p-1 bg-surface-container rounded-full">
<button aria-pressed="true" class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-full bg-primary text-on-primary font-label-large text-label-large transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span>Barang</span>
</button>
<button aria-pressed="false" class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-full text-on-surface-variant font-label-large text-label-large hover:text-on-surface transition-colors" type="button">
<span>Ruangan</span>
</button>
<button aria-pressed="false" class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-full text-on-surface-variant font-label-large text-label-large hover:text-on-surface transition-colors" type="button">
<span>Gedung</span>
</button>
</div>
</div>
<!-- Object Selection Card -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm flex flex-col gap-3">
<span class="font-title-small text-title-small text-on-surface">Pilih item barang</span>

<button class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-full bg-surface-container-low text-primary hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">qr_code_scanner</span>

</button>
<!-- Outlined Select Field -->
<div class="relative flex flex-col">
<label class="font-body-small text-body-small text-on-surface-variant mb-1" for="select-barang">Atau pilih barang</label>
<div class="flex items-center justify-between w-full p-3 rounded-lg bg-surface-container-low text-on-surface" id="select-barang" role="button" tabindex="0">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-body-medium text-body-medium text-on-surface truncate">Proyektor Epson EB-X500</span>
<span class="font-body-small text-body-small text-primary font-mono">BRG-ELK-042</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px] flex-shrink-0">arrow_drop_down</span>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[28px]">photo_camera</span>

</button>
<!-- Neutral Thumbnail Placeholder 1 -->
<div class="aspect-square bg-surface-container-high rounded-xl flex items-center justify-center text-outline">

</div>
<!-- Neutral Thumbnail Placeholder 2 -->
<div class="aspect-square bg-surface-container-high rounded-xl flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-[24px]">image</span>
</div>
</div>
</div>
<!-- Description Field -->

</div>

</div>

</div>
</div>
</div>

<span class="material-symbols-outlined text-[20px]">send</span>
